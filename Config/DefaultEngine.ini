; PROJECT ECLIPSE - Engine configuration.
;
; Purpose
;   Base engine settings for the Eclipse module: default maps, rendering features the
;   project targets (Lumen, Nanite, Virtual Shadow Maps), World Partition streaming and
;   the Gameplay Ability System globals.
;
; Notes
;   These values describe the intended shipping configuration. Per-platform overrides
;   belong in the matching DeviceProfiles entry, not here.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Eclipse/Maps/L_FallenBasin.L_FallenBasin
EditorStartupMap=/Game/Eclipse/Maps/L_FallenBasin.L_FallenBasin
GlobalDefaultGameMode=/Script/Eclipse.EclipseGameMode

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/Eclipse")

[/Script/Engine.RendererSettings]
; Lumen global illumination and reflections.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Virtual Shadow Maps.
r.Shadow.Virtual.Enable=1
; Nanite.
r.Nanite.ProjectEnabled=True
r.Nanite=1
; World Partition streaming for the open world.
r.WorldPartition.Enable=True
; Substrate is off for the slice; enable when material work begins.
r.Substrate=0

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6

[/Script/Engine.GameEngine]
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=200000
MaxInternetClientRate=100000
NetServerMaxTickRate=30

[/Script/Engine.AudioSettings]
DefaultSoundClassName=/Engine/EngineSounds/Master.Master

[/Script/GameplayAbilities.AbilitySystemGlobals]
bUseDebugTargetFromHud=False
