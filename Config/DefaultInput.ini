; PROJECT ECLIPSE - Input configuration.
;
; Purpose
;   Enhanced Input context mapping. The actual mappings live in the IMC_Eclipse asset
;   referenced from the player character; this file sets the default input classes and
;   the mouse/axis tuning the player controller expects.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; Console commands available to the debug tools during development.
+ConsoleCommands=(Key=F1,Command="Eclipse.Debug.ToggleMenu")
